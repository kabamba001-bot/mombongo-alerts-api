<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mombongo — Gestion VIP</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;max-width:420px;margin:32px auto;padding:0 16px;background:#f7f4ee;color:#222}
  h1{font-size:20px;margin-bottom:4px}
  p.sub{color:#666;font-size:13px;margin-top:0}
  label{display:block;margin-top:16px;font-size:14px;font-weight:600}
  input{width:100%;padding:11px;margin-top:5px;border:1px solid #ccc;border-radius:8px;font-size:15px;box-sizing:border-box}
  button{margin-top:10px;width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
  #btn-search{background:#e3e0d8;color:#222;margin-top:20px}
  #btn-save{background:#1a7a5e;color:#fff}
  #result{margin-top:18px;padding:12px;border-radius:8px;font-size:14px;white-space:pre-wrap;display:none;line-height:1.5}
  .ok{background:#e3f6e8;color:#1a7a3e}
  .err{background:#fdeaea;color:#b3261e}
  hr{border:none;border-top:1px solid #e0ddd4;margin:22px 0}
</style>
</head>
<body>
<h1>Mombongo — Gestion VIP</h1>
<p class="sub">Vérifie ou modifie le statut VIP d'un utilisateur par email, sans passer par Firebase.</p>

<label>Mot de passe admin</label>
<input type="password" id="secret" placeholder="•••••••••••" autocomplete="off">

<label>Email de l'utilisateur</label>
<input type="email" id="email" placeholder="exemple@gmail.com" autocomplete="off">

<button id="btn-search">🔍 Vérifier ce compte</button>

<hr>

<label>Nouvelle date d'expiration VIP</label>
<input type="date" id="until">

<button id="btn-save">✅ Enregistrer le VIP</button>

<div id="result"></div>

<script>
const API = '/api/set-vip';

function showResult(msg, ok){
  const el = document.getElementById('result');
  el.textContent = msg;
  el.className = ok ? 'ok' : 'err';
  el.style.display = 'block';
}

async function call(method){
  const secret = document.getElementById('secret').value.trim();
  const email = document.getElementById('email').value.trim();
  const until = document.getElementById('until').value;

  if(!secret || !email){ showResult('Mot de passe et email requis.', false); return; }
  if(method === 'POST' && !until){ showResult("Choisis une date d'expiration.", false); return; }

  const url = API + '?email=' + encodeURIComponent(email) + (method === 'POST' ? '&until=' + until : '');

  try{
    const res = await fetch(url, {
      method,
      headers: { 'Authorization': 'Bearer ' + secret }
    });
    const data = await res.json();

    if(!res.ok){ showResult('Erreur : ' + (data.error || res.status), false); return; }

    if(method === 'GET'){
      showResult(
        'Compte trouvé ✅\n' +
        'Nom : ' + (data.displayName || '(non renseigné)') + '\n' +
        "VIP actuellement jusqu'au : " + (data.vipUntil || 'aucun / expiré'),
        true
      );
    } else {
      showResult('✅ VIP mis à jour jusqu\'au ' + data.vipUntil + '\npour ' + data.email, true);
    }
  }catch(e){
    showResult('Erreur réseau : ' + e.message, false);
  }
}

document.getElementById('btn-search').addEventListener('click', () => call('GET'));
document.getElementById('btn-save').addEventListener('click', () => call('POST'));
</script>
</body>
</html>
