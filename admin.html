<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mombongo — Gestion des paliers</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;max-width:420px;margin:32px auto;padding:0 16px;background:#f7f4ee;color:#222}
  h1{font-size:20px;margin-bottom:4px}
  p.sub{color:#666;font-size:13px;margin-top:0}
  label{display:block;margin-top:16px;font-size:14px;font-weight:600}
  input, select{width:100%;padding:11px;margin-top:5px;border:1px solid #ccc;border-radius:8px;font-size:15px;box-sizing:border-box;background:#fff;font-family:inherit}
  button{margin-top:10px;width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
  #btn-search{background:#e3e0d8;color:#222;margin-top:20px}
  #btn-save-plan{background:#1a7a5e;color:#fff}
  #result{margin-top:18px;padding:12px;border-radius:8px;font-size:14px;white-space:pre-wrap;display:none;line-height:1.5}
  .ok{background:#e3f6e8;color:#1a7a3e}
  .err{background:#fdeaea;color:#b3261e}
  hr{border:none;border-top:1px solid #e0ddd4;margin:22px 0}
  h2{font-size:15px;margin:0;}
  p.section-note{color:#888;font-size:12px;margin:2px 0 0;}
</style>
</head>
<body>
<h1>Mombongo — Gestion des paliers</h1>
<p class="sub">Vérifie ou active le palier (Simple/Business/Pro) d'un utilisateur par email, sans passer par Firebase.</p>

<label>Mot de passe admin</label>
<input type="password" id="secret" placeholder="•••••••••••" autocomplete="off">

<label>Email de l'utilisateur</label>
<input type="email" id="email" placeholder="exemple@gmail.com" autocomplete="off">

<button id="btn-search">🔍 Vérifier ce compte</button>

<hr>

<h2>Palier Mombongo</h2>
<p class="section-note">C'est ce réglage que l'app utilise réellement pour débloquer Business/Pro.</p>
<label>Palier</label>
<select id="plan">
  <option value="simple">Simple payant</option>
  <option value="business">Business</option>
  <option value="pro">Pro</option>
</select>
<label>Date d'expiration</label>
<input type="date" id="expdate">
<button id="btn-save-plan">✅ Activer ce palier</button>

<div id="result"></div>

<script>
const API = '/api/set-vip';
const PLAN_LABELS = { simple: 'Simple', business: 'Business', pro: 'Pro' };

function showResult(msg, ok){
  const el = document.getElementById('result');
  el.textContent = msg;
  el.className = ok ? 'ok' : 'err';
  el.style.display = 'block';
}

function describePlan(data){
  const plan = PLAN_LABELS[data.userPlan] || 'Simple';
  const status = data.userPlanStatus || 'free';
  if(status === 'free') return plan + ' (gratuit)';
  if(status === 'trial') return plan + ' (essai)';
  if(status === 'active'){
    const exp = data.userPlanExpiresAt ? new Date(data.userPlanExpiresAt).toLocaleDateString('fr-FR') : '?';
    return plan + ' (actif jusqu\'au ' + exp + ')';
  }
  if(status === 'expired') return plan + ' (expiré)';
  return plan + ' (' + status + ')';
}

function toDateStr(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Date par défaut proposée à l'ouverture : aujourd'hui + 30 jours.
(function initDefaultDate(){
  const d = new Date();
  d.setDate(d.getDate() + 30);
  document.getElementById('expdate').value = toDateStr(d);
})();

// method: 'GET' ou 'POST'. params : objet ajouté à la query string en plus de l'email
// (ex. { plan: 'business', date: '2026-09-18' }).
async function call(method, params){
  const secret = document.getElementById('secret').value.trim();
  const email = document.getElementById('email').value.trim();
  if(!secret || !email){ showResult('Mot de passe et email requis.', false); return; }

  const qs = new URLSearchParams(Object.assign({ email }, params || {}));
  const url = API + '?' + qs.toString();

  try{
    const res = await fetch(url, {
      method,
      headers: { 'Authorization': 'Bearer ' + secret }
    });
    const data = await res.json();

    if(!res.ok){ showResult('Erreur : ' + (data.error || res.status), false); return; }

    if(method === 'GET'){
      showResult(
        'Compte trouvé ✅\n' +
        'Nom : ' + (data.displayName || '(non renseigné)') + '\n' +
        'Palier actuel : ' + describePlan(data),
        true
      );
    } else {
      const expDate = new Date(data.userPlanExpiresAt).toLocaleDateString('fr-FR');
      const label = PLAN_LABELS[data.userPlan] || data.userPlan;
      const msg = data.userPlanStatus === 'expired'
        ? '⛔ Palier ' + label + ' marqué expiré (date choisie : ' + expDate + ')\npour ' + data.email
        : '✅ Palier ' + label + ' activé jusqu\'au ' + expDate + '\npour ' + data.email;
      showResult(msg, true);
    }
  }catch(e){
    showResult('Erreur réseau : ' + e.message, false);
  }
}

document.getElementById('btn-search').addEventListener('click', () => call('GET'));

document.getElementById('btn-save-plan').addEventListener('click', () => {
  const plan = document.getElementById('plan').value;
  const date = document.getElementById('expdate').value;
  if(!date){ showResult('Choisis une date d\'expiration.', false); return; }
  call('POST', { plan, date });
});
</script>
</body>
</html>
